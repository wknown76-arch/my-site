<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내가 좋아하는 것</title>

    <!-- Google Fonts의 Jua 글꼴 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <!-- 외부 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>💙 내가 좋아하는 것 💙</h1>
    <p class="intro">제가 좋아하는 3가지를 소개합니다!</p>

    <!-- 카드들을 담는 공간 -->
    <div class="card-container">

        <div class="card">
            <div class="emoji">🎵</div>
            <h2>음악 듣기</h2>
            <p>좋아하는 음악을 들으면 기분이 좋아져요.</p>
        </div>

        <div class="card">
            <div class="emoji">🍕</div>
            <h2>맛있는 음식</h2>
            <p>친구들과 맛있는 음식을 먹는 것을 좋아해요.</p>
        </div>

        <div class="card">
            <div class="emoji">🎮</div>
            <h2>게임하기</h2>
            <p>시간이 날 때 재미있는 게임을 즐겨요.</p>
        </div>

    </div>

</body>
</html>
