<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리 동네 맛집 소개</title>

    <style>
        body {
            background-color: #fff8e7;
            text-align: center;
            font-family: sans-serif;
        }

        .card {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px #cccccc;
        }
    </style>
</head>

<body>

    <h1>🍴 우리 동네 맛집 소개</h1>
    <p>제가 추천하는 우리 동네 맛집 3곳입니다!</p>

    <div class="card">
        <h2>🌶️ 행복 분식</h2>
        <p>떡볶이와 김밥이 맛있는 곳입니다.</p>
        <p>추천 메뉴 : 떡볶이</p>
    </div>

    <div class="card">
        <h2>🍕 우리 피자</h2>
        <p>치즈가 듬뿍 들어간 피자가 맛있어요.</p>
        <p>추천 메뉴 : 치즈 피자</p>
    </div>

    <div class="card">
        <h2>🍰 달콤 카페</h2>
        <p>디저트를 먹으며 쉬기 좋은 카페입니다.</p>
        <p>추천 메뉴 : 딸기 케이크</p>
    </div>

</body>
</html>
