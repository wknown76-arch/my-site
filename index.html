<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>나의 자기소개</title>

    <style>
        /* 웹페이지 전체 디자인 설정 */
        body {
            background-color: lightblue; /* 배경을 연한 하늘색으로 설정 */
            text-align: center;          /* 글자를 가운데 정렬 */
            font-family: Arial, sans-serif;
        }

        /* 좋아하는 것 목록 설정 */
        ul {
            display: inline-block;
            text-align: left;
        }
    </style>
</head>

<body>

    <!-- 자기소개 제목 -->
    <h1>안녕하세요, 저는 '접미다예'예요</h1>

    <!-- 간단한 자기소개 -->
    <p>저의 자기소개 웹페이지에 오신 것을 환영합니다!</p>

    <!-- 좋아하는 것 소개 -->
    <h2>💙 제가 좋아하는 것</h2>

    <ul>
        <li>🎵 음악 듣기</li>
        <li>🍕 맛있는 음식 먹기</li>
        <li>🎮 게임하기</li>
    </ul>

    <!-- 마지막 인사 -->
    <p>제 소개를 읽어주셔서 감사합니다! 😊</p>

</body>

</html>
